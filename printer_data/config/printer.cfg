#Raspberry Pi 4 Model B Rev 1.5
#BTT OCTOPUS
#STM32F446ZET6

[mcu]
serial: /dev/ttyAMA0
restart_method: command
#USB: /dev/serial/by-id/usb-Klipper_stm32f446xx_0E0031001950534841313020-if00
#USART2: PD6/PD5  /dev/ttyAMA0
#canbus_uuid: 1f32125145c3

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 4000    			
max_z_velocity: 50   #Increase your max_z_velocity in increments of 25-50 at a time. Test with multiple tool changes between increments
max_z_accel: 500  #1000     #Increase your max_z_accel in increments of 100-200 at a time. Test with multiple tool changes between increments.
square_corner_velocity: 5.0

[include configs/*.cfg]
[include configs/AFC/*.cfg]
[include configs/KAMP/*.cfg]
[include configs/led_templates/*.cfg]
[include toolchanger/dock_tuner.cfg]
[include toolchanger/readonly-configs/toolchanger-include.cfg]

[gcode_macro _CLIENT_VARIABLE]
#variable_use_custom_pos    : True
#variable_custom_park_x     : 30
#variable_custom_park_y     : 306
#variable_custom_park_dz    : 10.0  ; custom dz value; the value in mm to lift the nozzle when move to park position
#variable_retract           : 2.0   ; the value to retract while PAUSE
#variable_cancel_retract    : 2.0   ; the value to retract while CANCEL_PRINT
#variable_speed_retract     : 35.0  ; retract speed in mm/s
#variable_unretract         : 1.8   ; the value to unretract while RESUME
#variable_speed_unretract   : 35.0  ; unretract speed in mm/s
#variable_speed_hop         : 15.0  ; z move speed in mm/s
#variable_speed_move        : 100.0 ; move speed in mm/s
#variable_park_at_cancel    : True  ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
#variable_park_at_cancel_x  : 30     ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
#variable_park_at_cancel_y  : 306   ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
#variable_use_fw_retract    : False ; use fw_retraction instead of the manual version [True/False]
#variable_idle_timeout      : 14400     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
