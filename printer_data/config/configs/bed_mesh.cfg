[bed_mesh]
speed: 200
horizontal_move_z: 3
mesh_min: 20, 30
mesh_max: 270,250
fade_start: 0.6
fade_end: 10.0
probe_count: 5,5
algorithm: bicubic

[quad_gantry_level]
gantry_corners:
	-60,-10
	360,370
points:
	50,30
	50,250
	250,250
	250,30
speed: 1500
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.008
max_adjust: 10

##########################
#         MACROS         #
##########################
[gcode_macro _CG28]
gcode:
    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
    G28
    {% endif %}

[gcode_macro _CQGL]
gcode:
    {% if printer.quad_gantry_level.applied|lower == 'false' %}
    BTT_QUAD_GANTRY_LEVEL
    {% endif %}