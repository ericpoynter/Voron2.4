# status_off
# status_heating
# status_cooling
# status_printing

[output_pin Chamber_Lights] #white leds
pin: CH:gpio9
pwm: True
value: 1.0
shutdown_value: 0
cycle_time: 0.01

[neopixel chamber_leds]
pin: CH:gpio7
chain_count: 5
#Chamber Heater LED: (1)
#Canopy LEDS: (2-5)
color_order: GRBW
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0

[neopixel sb_leds]
pin: NHK:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0

##########################
# LED Effects Animations #
##########################

##################
## logo effects ##
##################

[led_effect sb_logo_heating]
leds:
    neopixel:sb_leds (3)
autostart: false
frame_rate: 24
layers:
     breathing  3 1 top (1, 0, 0)

[led_effect sb_logo_cooling]
leds:
    neopixel:sb_leds (3)
autostart: false
frame_rate: 24
layers:
     breathing  3 1 top (0, 0, 1)

[led_effect sb_logo_printing]
leds:
    neopixel:sb_leds (3)
autostart: false
frame_rate: 24
layers:
    static         0  0     top        (0.0,  0.0, 1.0)

##################
## Canopy effects ##
##################

[led_effect chamber_heating]
leds:
    neopixel:chamber_leds
autostart: false
frame_rate: 24
layers:
     breathing  3 1 top (1, 0, 0)

[led_effect chamber_cooling]
leds:
    neopixel:chamber_leds
autostart: false
frame_rate: 24
layers:
     breathing  3 1 top (0, 0, 1)

[led_effect chamber_printing]
leds:
    neopixel:chamber_leds
autostart: false
frame_rate: 24
layers:
    static         0  0     top        (0.0,  0.0, 1.0)


#####################
## all led effects ##
#####################

[led_effect sb_critical_error]
leds:
    neopixel:sb_leds
layers:
    strobe         1  1.5   add        (1.0,  1.0, 1.0)
    breathing      2  0     difference (0.95, 0.0, 0.0)
    static         1  0     top        (1.0,  0.0, 0.0)
autostart: false
frame_rate: 24
run_on_error: true

[led_effect rainbow]
leds:
    neopixel:sb_leds
autostart: false
frame_rate: 24
layers:
    gradient  0.3  1 add (0.3, 0.0, 0.0),(0.0, 0.3, 0.0),(0.0, 0.0, 0.3)

#######################
# LED Effects Statics #
#######################

[led_effect set_nozzle_leds]
leds:
    neopixel:sb_leds (1,2)
autostart: true
frame_rate: 24
layers:
    static         0  0     top        (0.0,  0.0, 0.0, 1.0)

[led_effect set_logo_leds]
leds:
    neopixel:sb_leds (1,2)
autostart: false
frame_rate: 24
layers:
    static         0  0     top        (1.0,  1.0, 1.0)

##############
# The Macros #
##############

[gcode_macro set_logo_leds_off]
gcode:
    SET_LED_EFFECT EFFECT=set_logo_leds STOP=1

[gcode_macro set_logo_leds_on]
gcode:
    SET_LED_EFFECT EFFECT=set_logo_leds

[gcode_macro set_nozzle_leds_on]
gcode:
    SET_LED_EFFECT EFFECT=set_nozzle_leds

[gcode_macro set_nozzle_leds_off]
gcode:
    SET_LED_EFFECT EFFECT=set_nozzle_leds STOP=1

[gcode_macro status_off]
gcode:
    STOP_LED_EFFECTS
    set_nozzle_leds_on

[gcode_macro status_heating]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_heating
    SET_LED_EFFECT EFFECT=chamber_heating
    set_nozzle_leds_on

[gcode_macro status_cooling]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_cooling
    SET_LED_EFFECT EFFECT=chamber_cooling
    set_nozzle_leds_on

[gcode_macro status_printing]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_printing
    SET_LED_EFFECT EFFECT=chamber_printing
    set_nozzle_leds_on

[gcode_macro CHAMBER_LIGHTS_OFF]
gcode:
     SET_PIN PIN=Chamber_Lights VALUE=0

[gcode_macro CHAMBER_LIGHTS_ON]
gcode:
     SET_PIN PIN=Chamber_Lights VALUE=1

[gcode_macro _chamber_heater_on]
gcode:
      SET_LED_EFFECT EFFECT=chamber_heating
      Chamber_Lights_On

[gcode_macro _chamber_heater_off]
gcode:
      SET_LED_EFFECT EFFECT=chamber_printing
      Chamber_Lights_On    
