[gcode_macro PRINT_START]
gcode:
  SET_GCODE_OFFSET Z=0
  BED_MESH_CLEAR
  set_nozzle_leds_on
  RESPOND TYPE=command MSG='Homing'
  G28
 	{% set BED_TEMP = params.BED|default(60)|float %}
 	{% set EXTRUDER_TEMP = params.EXTRUDER|default(195)|float %}
 	{% set S_EXTRUDER_TEMP = 150|float %}
    {% set CHAMBER_TEMP = params.CHAMBER|default("45")|int %}
    {% set initial_tool = params.TOOL|default("0")|int %}
  M107                          ; Print fan off
  M141 S{CHAMBER_TEMP}  
  RESPOND TYPE=command MSG='Heating Bed'
  _chamber_filter_fan_on
  M140 S{BED_TEMP}              ; Set bed temperature
  AFC_PARK
  M190 S{BED_TEMP}              ; Set and wait for bed temperature    
  RESPOND TYPE=command MSG='Cleaning Nozzle'
  AFC_BRUSH 
  RESPOND TYPE=command MSG='Homing with Contact method'
  G28 Z METHOD=CONTACT CALIBRATE=1 
  RESPOND TYPE=command MSG='Leveling Gantry'
  QUAD_GANTRY_LEVEL
  RESPOND TYPE=command MSG='Meshing Bed'
  BED_MESH_CALIBRATE ADAPTIVE=1
  RESPOND TYPE=command MSG='Cleaning Nozzle'
  AFC_BRUSH
  G28 Z METHOD=CONTACT CALIBRATE=0 
  AFC_PARK  
  RESPOND TYPE=command MSG='Waiting for Extruder Temp'
  M109 S{EXTRUDER_TEMP }        ; Set and wait for extruder temperature  
  T{initial_tool} #Load Initial Tool
  SET_GCODE_OFFSET Z=-0.04
  RESPOND TYPE=command MSG='Line Purge'
  Line_Purge                ; Purge line macro
  status_printing           ; Set LEDs to printing-mode
  RESPOND TYPE=command MSG='Printing'

[gcode_macro PRINT_END]
gcode:
     G92 E0 ; Reset extruder position
     G1 E-4.0 F3600 ; Retract 4mm of filament at a speed of 3600 mm/min (60 mm/s)    
     G91 ; Use relative positioning
     G0 Z20 F3600 ; Move nozzle up 10mm
     G90 ; Use absolute positioning    
     TURN_OFF_HEATERS
     M107                                                     # turn off fan
     G1 X{300} Y{300} F3600                                   # park nozzle

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    G1 E-4.0 F3600 ; Retract 4mm of filament at a speed of 3600 mm/min (60 mm/s) 
    {% if printer.toolhead.homed_axes == "xyz" %}
        G91 ; Relative positioning
        G1 Z5 F3000 ; Move nozzle up
        G90 ; Absolute positioning
        G1 X300 Y300 F3000 ; Park nozzle (adjust to your printer)
    {% endif %}
    BASE_CANCEL_PRINT
    M107                                                     # turn off fan


  
  