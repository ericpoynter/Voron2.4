[mcu CH]
serial: /dev/serial/by-id/usb-Klipper_rp2040_303339383406B44A-if00

[temperature_sensor NHK_CH]
sensor_type: temperature_mcu
sensor_mcu: CH
min_temp: 0
max_temp: 100
    
[heater_generic Heater_Chamber]
gcode_id: CH
heater_pin: CH:gpio5
pullup_resistor: 2200
sensor_type: Generic 3950
sensor_pin: CH:gpio29
control: pid
pid_kp = 6.952
pid_ki = 0.293
pid_kd = 41.192
min_temp: 5
max_temp: 100

[verify_heater Heater_Chamber]
max_error: 120
check_gain_time: 120
hysteresis: 50
heating_gain: 1

[heater_fan Chamber_Heater_Fan]
pin: CH:gpio6
max_power: 1.0
shutdown_speed: 1
kick_start_time: 0.5
heater: Heater_Chamber
heater_temp: 40 # fan will turn off below this level

############################
# gcodes
############################

[gcode_macro M141]  #set chamber temp
gcode:
   SET_HEATER_TEMPERATURE HEATER=Heater_Chamber TARGET={params.S}
   RESPOND TYPE=command MSG='Heating Chamber'
   _chamber_heater_on
   
[gcode_macro M191]  #wait for chamber temp
gcode:
   SET_HEATER_TEMPERATURE HEATER=Heater_Chamber TARGET={params.S}
   TEMPERATURE_WAIT SENSOR="heater_generic Heater_Chamber" MINIMUM={params.S}
   RESPOND TYPE=command MSG='Heating Chamber'
   _chamber_heater_on

[gcode_macro PID_CHAMBER]
gcode:
      G28
      PID_CALIBRATE HEATER=Heater_Chamber TARGET=60
      M141 S60
      TURN_OFF_HEATERS
      SAVE_CONFIG