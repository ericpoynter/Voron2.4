#Phaetus Rapido
#PHAETUS ENDCOAT NOZZLE FOR CF FILament
[mcu T0]
serial:  /dev/serial/by-id/usb-Klipper_rp2040_30333938340670FC-if00
restart_method: command

[tool T0]
tool_number: 0
extruder: extruder
fan: T0_part_cooling_fan
#detection_pin: T0:gpio10
gcode_x_offset: 0  #must always be zero for T0.
gcode_y_offset: 0  #must always be zero for T0.
gcode_z_offset: 0  #must always be zero for T0.
params_park_x: 3.5
params_park_y: -4.5
params_park_z: 245
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 62.2
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 44.0
params_input_shaper_damping_ratio_y: 0.01 

[tool_probe T0]
pin: T0:gpio10
tool: 0
z_offset: -1.597   # Needs to be calibrated. More positive = More Squish
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode: _TAP_PROBE_ACTIVATE HEATER=extruder

[extruder]
step_pin: T0:gpio23
dir_pin: !T0:gpio24
enable_pin: !T0:gpio25
full_steps_per_rotation: 200
microsteps: 32
gear_ratio: 9:1
nozzle_diameter: 0.400
filament_diameter: 1.75
rotation_distance: 47.54  #New RD = Old RD *(120-x)/100  #####  G1 E100 F100   ####
heater_pin: T0:gpio9
sensor_pin: T0:gpio29
pullup_resistor: 2200
sensor_type: ATC Semitec 104NT-4-R025H42G
control: pid
pid_Kp=28.698
pid_Ki=1.952
pid_Kd=105.465
smooth_time: 2.0
min_temp: 0
max_temp: 290
max_power: 1.0
min_extrude_temp: 180
max_extrude_only_distance: 300
max_extrude_cross_section: 5
pressure_advance: 0.03
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: T0:gpio0
tx_pin: T0:gpio1
interpolate: false
sense_resistor: 0.100
run_current: 0.8

[fan_generic T0_part_cooling_fan]
pin: T0:gpio6

[heater_fan T0_hotend_fan]
pin: T0:gpio5
heater: extruder
heater_temp: 50.0

[temperature_sensor NHK0]
sensor_type: temperature_mcu
sensor_mcu: T0
min_temp: 0
max_temp: 100

[adxl345 T0]
cs_pin: T0:gpio27
spi_software_sclk_pin: T0:gpio18
spi_software_mosi_pin: T0:gpio20
spi_software_miso_pin: T0:gpio19
axes_map: -x,-z,-y

[neopixel T0_leds]
pin: T0:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0

[gcode_macro _T0_vars]
variable_logo_led_name:         "T0_leds"
variable_logo_idx:              "3"
variable_logo_brightness:       "1"
variable_nozzle_led_name:       "T0_leds"
variable_nozzle_idx:            "1,2"
variable_nozzle_brightness:     "1,1"
gcode:

[gcode_macro T0]
variable_active: 0 # Must be zero
variable_color: "" # Leave empty
gcode: SELECT_TOOL T=0