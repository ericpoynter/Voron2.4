#Phaetus Rapido
[mcu T3]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3136313132023FA6-if00
restart_method: command

[tool T3]
tool_number: 3
extruder: extruder3
fan: T3_part_fan
detection_pin: !T3:gpio10
gcode_x_offset: -0.272500
gcode_y_offset: 0.197500
gcode_z_offset: -0.347000
params_park_x: 223.0
params_park_y: -8
params_park_z: 246
#params_input_shaper_type_x: 'mzv'
#params_input_shaper_freq_x: 62.2
#params_input_shaper_damping_ratio_x: 0.01
#params_input_shaper_type_y: 'mzv'
#params_input_shaper_freq_y: 44.0
#params_input_shaper_damping_ratio_y: 0.01 

[extruder3]
step_pin: T3:gpio23
dir_pin: !T3:gpio24
enable_pin: !T3:gpio25
full_steps_per_rotation: 200
microsteps: 32
gear_ratio: 9:1
nozzle_diameter: 0.400
filament_diameter: 1.75
rotation_distance: 47.54  #New RD = Old RD *(120-x)/100  #####  G1 E100 F100   ####
heater_pin: T3:gpio9
sensor_pin: T3:gpio29
pullup_resistor: 2200
sensor_type: ATC Semitec 104NT-4-R025H42G
control: pid
pid_Kp=17.533
pid_Ki=1.391
pid_Kd=55.229
smooth_time: 2.0
min_temp: 0
max_temp: 270
max_power: 1.0
min_extrude_temp: 180
max_extrude_only_distance: 300
max_extrude_cross_section: 5
pressure_advance: 0.03
pressure_advance_smooth_time: 0.040

[tmc2209 extruder3]
uart_pin: T3:gpio0
tx_pin: T3:gpio1
interpolate: false
sense_resistor: 0.100
run_current: 0.8

[fan_generic T3_part_fan]
pin: T3:gpio6

[heater_fan T3_hotend_fan]
pin: T3:gpio5
heater: extruder3
heater_temp: 50.0

[temperature_sensor NHK3]
sensor_type: temperature_mcu
sensor_mcu: T3
min_temp: 0
max_temp: 100

[adxl345 T3]
cs_pin: T3:gpio27
spi_software_sclk_pin: T3:gpio18
spi_software_mosi_pin: T3:gpio20
spi_software_miso_pin: T3:gpio19
axes_map: x,z,y

[neopixel T3_leds]
pin: T3:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0

[gcode_macro _T3_vars]
variable_logo_led_name:         "T3_leds"
variable_logo_idx:              "3"
variable_logo_brightness: "1"
variable_nozzle_led_name:       "T3_leds"
variable_nozzle_idx:            "1,2"
variable_nozzle_brightness: "1,1"
gcode:

[gcode_macro T3]
variable_active: 0 # Must be zero.
variable_color: ""
gcode: SELECT_TOOL T=3